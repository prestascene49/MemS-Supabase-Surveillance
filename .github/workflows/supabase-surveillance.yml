name: Surveillance Supabase MemS

on:
  schedule:
    - cron: '17 6,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verifier la base Supabase
        env:
          SUPABASE_URL: https://wzymtyrsocjzujllkupz.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 20 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/mems_spectacles?select=id&limit=1"
